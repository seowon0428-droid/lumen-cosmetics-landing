<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMEN | 문의 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-page">
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="index.html">LUMEN</a>
        <nav class="site-nav" aria-label="관리자 메뉴">
          <a href="index.html">사이트로</a>
          <button type="button" class="admin-logout" id="logout-btn" hidden>
            로그아웃
          </button>
        </nav>
      </div>
    </header>

    <main class="admin-main container">
      <section class="admin-panel" id="login-panel" aria-labelledby="login-title">
        <h1 class="admin-title" id="login-title">문의 관리</h1>
        <p class="admin-lead">
          admin1·admin2·admin3 계정으로 로그인합니다. 권한에 따라 탭이
          달라집니다.
        </p>
        <form class="admin-form" id="login-form" novalidate>
          <div class="form-field">
            <label for="admin-email">관리자 이메일</label>
            <input
              type="email"
              id="admin-email"
              name="email"
              autocomplete="off"
              required
              placeholder=""
              value=""
            />
          </div>
          <div class="form-field">
            <label for="admin-password">비밀번호</label>
            <input
              type="password"
              id="admin-password"
              name="password"
              autocomplete="current-password"
              required
              minlength="8"
            />
          </div>
          <button type="submit" class="btn btn--full" id="login-btn">로그인</button>
          <p class="form-status" id="login-status" role="status"></p>
        </form>
      </section>

      <section
        class="admin-panel admin-panel--wide"
        id="inquiries-panel"
        hidden
        aria-labelledby="inquiries-title"
      >
        <div class="admin-panel__head">
          <h1 class="admin-title" id="inquiries-title">관리자</h1>
          <button type="button" class="btn" id="refresh-btn">새로고침</button>
        </div>
        <p class="admin-meta" id="admin-session-meta"></p>
        <div class="admin-tabs" role="tablist">
          <button
            type="button"
            class="admin-tabs__btn is-active"
            id="tab-inquiries"
            role="tab"
            aria-selected="true"
          >
            접수 문의
          </button>
          <button
            type="button"
            class="admin-tabs__btn"
            id="tab-board"
            role="tab"
            aria-selected="false"
          >
            게시판
          </button>
        </div>

        <div id="inquiries-section">
        <div class="admin-table-wrap">
          <table class="admin-table" id="inquiries-table">
            <thead>
              <tr>
                <th scope="col">접수일</th>
                <th scope="col">이름</th>
                <th scope="col">이메일</th>
                <th scope="col">문의 내용</th>
              </tr>
            </thead>
            <tbody id="inquiries-body"></tbody>
          </table>
        </div>
        <p class="admin-empty" id="inquiries-empty" hidden></p>
        <p class="form-status" id="list-status" role="status"></p>
        </div>

        <div id="board-section" hidden>
          <p class="admin-lead">게시글과 댓글을 확인하고, 관리자 댓글 작성·삭제할 수 있습니다.</p>
          <div class="admin-board-list" id="admin-board-list"></div>
          <p class="admin-empty" id="board-empty" hidden>게시글이 없습니다.</p>
          <p class="form-status" id="board-status" role="status"></p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
